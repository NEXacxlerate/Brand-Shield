# Local-development overlay:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Publishes Postgres and Redis on localhost only, so psql / redis-cli / the non-Docker server can reach them. Never use in production.
services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  api:
    environment:
      APP_ENV: local
      LOG_LEVEL: DEBUG
  worker:
    environment:
      APP_ENV: local
      LOG_LEVEL: DEBUG
