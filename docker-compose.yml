# docker compose up --build
#   API      http://localhost:8000   (docs at /docs)
#   Frontend http://localhost:5173   (sign in as admin@company.com with ADMIN_PASSWORD)
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /data
      FRONTEND_ORIGIN: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-dev-only-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!123}
    volumes:
      - scammind-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  scammind-data:
