server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (server level; do not add add_header inside locations, that would drop these).
  # Same policy as the BrandShield frontend: Studio only loads Google Fonts besides its own files and calls /api on the same origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /studio {
    return 301 /studio/;
  }

  # Hashed build assets can be cached for a year; a missing asset is a 404, never index.html.
  location /studio/assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app under /studio/: unknown paths fall back to /studio/index.html (never cached).
  location /studio/ {
    expires -1;
    try_files $uri /studio/index.html;
  }
}
